apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-app
  template:
    metadata:
      labels:
        app: mini-app
    spec:
      containers:
        - name: mini-app
          image: ghcr.io/vit363/k8s-mini-project:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key:  APP_MODE
