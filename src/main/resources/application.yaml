server:
  port: 8080

spring:
  application:
    name: k8s-mini-project

management:
  otlp:
    metrics:
      export:
        enabled: false
  endpoint:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [${spring.application.name},%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"