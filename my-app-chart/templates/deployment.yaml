apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-deployment"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-mini-app"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-mini-app"
    spec:
      containers:
        - name: mini-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-config"
                  key: APP_MODE